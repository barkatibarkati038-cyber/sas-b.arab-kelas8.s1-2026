                    { id: 'p3', text: '3. Isim Isyarah (Kata Tunjuk) jarak dekat untuk Mu\'annats (perempuan)' },
                    { id: 'p4', text: '4. Kata keterangan tempat yang berarti "Di antara"' },
                    { id: 'p5', text: '5. Istilah bahasa Arab untuk "Ruang Kepala Sekolah"' },
                    { id: 'p6', text: '6. Kata benda di awal kalimat nominal yang berfungsi sebagai Subjek' },
                    { id: 'p7', text: '7. Kata/frasa penjelas pelengkap Mubtada\' sebagai Predikat' },
                    { id: 'p8', text: '8. Sebutan bahasa Arab untuk "Sekolah Menengah Pertama / Tsanawiyah Negeri"' },
                    { id: 'p9', text: '9. Fasilitas sekolah yang berfungsi sebagai tangga' },
                    { id: 'p10', text: '10. Lawan kata (antonim) dari kata Malas' }
                ],
                targets: [
                    { id: 't1', text: 'مُتَّسِخٌ', isArabic: true },
                    { id: 't2', text: 'غُرْفَةُ الصَّحَّةِ', isArabic: true },
                    { id: 't3', text: 'هَذِهِ', isArabic: true },
                    { id: 't4', text: 'بَيْنَ', isArabic: true },
                    { id: 't5', text: 'غُرْفَةُ رَئِيسِ الْمَدْرَسَةِ', isArabic: true },
                    { id: 't6', text: 'مُبْتَدَأٌ', isArabic: true },
                    { id: 't7', text: 'خَبَرٌ', isArabic: true },
                    { id: 't8', text: 'مَدْرَسَةٌ مُتَوَسِّطَةٌ حُكُومِيَّةٌ', isArabic: true },
                    { id: 't9', text: 'سُلَّمٌ', isArabic: true },
                    { id: 't10', text: 'نَشِيطٌ', isArabic: true }
                ],
                correctAnswers: { 'p1':'t1', 'p2':'t2', 'p3':'t3', 'p4':'t4', 'p5':'t5', 'p6':'t6', 'p7':'t7', 'p8':'t8', 'p9':'t9', 'p10':'t10' }
            }
        ];

        // ==========================================
        // UTILITY FUNCTIONS
        // ==========================================
        const shuffleArray = (array) => {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        };

        const generateShuffledExam = () => {
            return shuffleArray(rawQuestionsData).map(q => {
                if (q.type === 'mc' && q.options) {
                    return { ...q, options: shuffleArray(q.options) };
                }
                return q;
            });
        };

        // Static Icons to prevent React flickering
        const SvgIcon = ({ path, className="w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="1.5" stroke="currentColor" className={className}>
                <path strokeLinecap="round" strokeLinejoin="round" d={path} />
            </svg>
        );
        const IconClock = () => <SvgIcon path="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />;
        const IconAlert = () => <SvgIcon path="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3Z" />;
        const IconCheck = () => <SvgIcon path="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />;

        // ==========================================
        // CUSTOM MODALS
        // ==========================================
        const ModalAlert = ({ title, message, onConfirm, isDanger }) => (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
                <div className="bg-white rounded-2xl p-8 max-w-md w-[90%] shadow-2xl text-center">
                    <div className={`mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4 ${isDanger ? 'bg-red-100 text-red-600' : 'bg-yellow-100 text-yellow-600'}`}>
                        {isDanger ? <IconAlert /> : <IconClock />}
                    </div>
                    <h3 className="text-xl font-bold mb-2">{title}</h3>
                    <p className="text-gray-600 mb-6">{message}</p>
                    <button onClick={onConfirm} className={`w-full py-3 px-4 rounded-xl font-bold text-white transition ${isDanger ? 'bg-red-600 hover:bg-red-700' : 'bg-cyan-600 hover:bg-cyan-700'}`}>
                        Mengerti
                    </button>
                </div>
            </div>
        );

        const ModalConfirm = ({ title, message, onConfirm, onCancel }) => (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
                <div className="bg-white rounded-2xl p-8 max-w-md w-[90%] shadow-2xl text-center">
                    <div className="mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-blue-100 text-blue-600">
                        <IconCheck />
                    </div>
                    <h3 className="text-xl font-bold mb-2">{title}</h3>
                    <p className="text-gray-600 mb-6">{message}</p>
                    <div className="flex gap-4">
                        <button onClick={onCancel} className="flex-1 py-3 px-4 rounded-xl font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 transition">Batal</button>
                        <button onClick={onConfirm} className="flex-1 py-3 px-4 rounded-xl font-bold text-white bg-cyan-600 hover:bg-cyan-700 transition">Ya, Selesai</button>
                    </div>
                </div>
            </div>
        );

        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        const App = () => {
            const [view, setView] = useState('login'); // login, resume_prompt, exam, finished
            const [student, setStudent] = useState({ nama: '', kelas: '', tanggal: new Date().toISOString().split('T')[0] });
            const [questions, setQuestions] = useState([]);
            const [answers, setAnswers] = useState({});
            const [activeIdx, setActiveIdx] = useState(0);
            const [timeLeft, setTimeLeft] = useState(EXAM_DURATION);
            const [violations, setViolations] = useState(0);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [scoreResult, setScoreResult] = useState(0);
            
            // Modal States
            const [modal, setModal] = useState(null); // { type, title, message, onConfirm, onCancel, isDanger }

            // Cek Session Saat Awal Render
            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed.timeLeft > 0 && parsed.status === 'running') {
                            setStudent(parsed.student);
                            setQuestions(parsed.questions);
                            setAnswers(parsed.answers);
                            setTimeLeft(parsed.timeLeft);
                            setViolations(parsed.violations || 0);
                            setView('resume_prompt');
                        }
                    } catch(e) {}
                }
            }, []);

            // Auto-Save Effect
            useEffect(() => {
                if (view === 'exam') {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        status: 'running', student, questions, answers, timeLeft, violations
                    }));
                }
            }, [view, answers, timeLeft, violations, questions, student]);

            // Timer Effect
            useEffect(() => {
                if (view !== 'exam') return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleForceSubmit("Waktu Ujian Habis!");
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [view]);

            // Anti-Cheat Events
            useEffect(() => {
                if (view !== 'exam') return;
                
                const handleContextMenu = (e) => e.preventDefault();
                const handleCopy = (e) => e.preventDefault();
                
                const handleVisibilityAndFullscreen = () => {
                    if (document.hidden || !document.fullscreenElement) {
                        setViolations(v => {
                            const newV = v + 1;
                            if (newV >= 2) {
                                handleForceSubmit("Pelanggaran Maksimal! Ujian dihentikan otomatis.");
                            } else {
                                setModal({
                                    type: 'alert',
                                    title: "Peringatan Pelanggaran!",
                                    message: "Anda terdeteksi keluar dari layar ujian atau berpindah tab. Jika diulangi, ujian akan otomatis dikumpulkan.",
                                    isDanger: true,
                                    onConfirm: () => {
                                        setModal(null);
                                        document.documentElement.requestFullscreen().catch(()=>{});
                                    }
                                });
                            }
                            return newV;
                        });
                    }
                };

                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('copy', handleCopy);
                document.addEventListener('visibilitychange', handleVisibilityAndFullscreen);
                document.addEventListener('fullscreenchange', handleVisibilityAndFullscreen);

                return () => {
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('copy', handleCopy);
                    document.removeEventListener('visibilitychange', handleVisibilityAndFullscreen);
                    document.removeEventListener('fullscreenchange', handleVisibilityAndFullscreen);
                };
            }, [view]);

            const startNewExam = async () => {
                if (!student.nama || !student.kelas) return;
                try { await document.documentElement.requestFullscreen(); } catch(e) {}
                setQuestions(generateShuffledExam());
                setAnswers({});
                setTimeLeft(EXAM_DURATION);
                setViolations(0);
                setView('exam');
            };

            const resumeExam = async () => {
                try { await document.documentElement.requestFullscreen(); } catch(e) {}
                setView('exam');
            };

            const calculateScore = () => {
                let totalWeight = 0;
                let earnedPoints = 0;
                let details = [];

                questions.forEach(q => {
                    // Temukan data asli untuk referensi yang akurat
                    const originalQ = rawQuestionsData.find(ro => ro.id === q.id);
                    
                    if (q.type === 'mc') {
                        totalWeight += 3; // Bobot MCQ = 3
                        const ans = answers[q.id];
                        if (!ans) {
                            details.push(`Soal ${q.id}: KOSONG`);
                        } else if (ans === originalQ.correctAnswer) {
                            earnedPoints += 3;
                            details.push(`Soal ${q.id}: BENAR`);
                        } else {
                            details.push(`Soal ${q.id}: SALAH (Pilih: ${ans}, Kunci: ${originalQ.correctAnswer})`);
                        }
                    } else if (q.type === 'matching') {
                        let matchScore = 0;
                        let matchDetails = [];
                        totalWeight += 25; // Total 10 soal x 2.5
                        
                        originalQ.premises.forEach((p, idx) => {
                            const subId = idx + 1;
                            const ans = answers[`${q.id}_${p.id}`];
                            const correctTgt = originalQ.correctAnswers[p.id];
                            if (!ans) {
                                matchDetails.push(`Sub-${subId}:KOSONG`);
                            } else if (ans === correctTgt) {
                                matchScore += 2.5;
                                matchDetails.push(`Sub-${subId}:BENAR`);
                            } else {
                                matchDetails.push(`Sub-${subId}:SALAH(Kunci:${correctTgt})`);
                            }
                        });
                        earnedPoints += matchScore;
                        details.push(`Soal ${q.id} (Match): ` + matchDetails.join(', '));
                    }
                });

                const finalScore = (earnedPoints / totalWeight) * 100;
                return { score: Math.round(finalScore), rincian: details.join(' | ') };
            };

            const submitData = async (keterangan) => {
                setIsSubmitting(true);
                const { score, rincian } = calculateScore();
                setScoreResult(score);

                const payload = {
                    nama: student.nama,
                    kelas: student.kelas,
                    tanggal: student.tanggal,
                    skor: score,
                    pelanggaran: violations,
                    keterangan: keterangan,
                    rincianJawaban: rincian
                };

                try {
                    await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                } catch(e) { console.error(e); }

                localStorage.removeItem(STORAGE_KEY);
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(()=>{});
                }
                setView('finished');
                setModal(null);
                setIsSubmitting(false);
            };

            const handleForceSubmit = (reason) => {
                setModal(null);
                submitData(reason);
            };

            const promptSubmit = () => {
                setModal({
                    type: 'confirm',
                    title: "Kumpulkan Ujian?",
                    message: "Pastikan semua soal telah terjawab. Ujian yang sudah dikumpulkan tidak dapat diubah lagi.",
                    onConfirm: () => submitData("Selesai Normal"),
                    onCancel: () => setModal(null)
                });
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            // RENDER LOGIC
            if (view === 'login') {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white rounded-3xl p-8 md:p-12 w-full max-w-lg shadow-2xl">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-bold text-cyan-700 mb-2">BAHASA ARAB</h1>
                                <p className="text-gray-500 font-semibold">SUMATIF AKHIR SEMESTER (SAS) 2026/2026 - Kelas VIII</p>
                            </div>
                            <div className="space-y-5">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">Nama Lengkap</label>
                                    <input type="text" className="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-cyan-500 outline-none" value={student.nama} onChange={e => setStudent({...student, nama: e.target.value})} placeholder="Masukkan nama Anda" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">Kelas</label>
                                    <input type="text" className="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-cyan-500 outline-none" value={student.kelas} onChange={e => setStudent({...student, kelas: e.target.value})} placeholder="Contoh: VIII-A" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">Tanggal Ujian</label>
                                    <input type="date" className="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-cyan-500 outline-none" value={student.tanggal} onChange={e => setStudent({...student, tanggal: e.target.value})} />
                                </div>
                                <button onClick={startNewExam} disabled={!student.nama || !student.kelas} className="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-4 rounded-xl mt-6 transition disabled:opacity-50">
                                    Mulai Ujian (Fullscreen)
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'resume_prompt') {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl text-center">
                            <h2 className="text-2xl font-bold text-gray-800 mb-4">Sesi Ujian Tersimpan Ditemukan!</h2>
                            <p className="text-gray-600 mb-8">Anda memiliki ujian yang belum diselesaikan atas nama <strong>{student.nama}</strong>. Ingin melanjutkan?</p>
                            <div className="flex flex-col gap-3">
                                <button onClick={resumeExam} className="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 rounded-xl transition">Lanjutkan Ujian</button>
                                <button onClick={() => { localStorage.removeItem(STORAGE_KEY); setView('login'); }} className="w-full bg-red-100 hover:bg-red-200 text-red-700 font-bold py-3 rounded-xl transition">Mulai Ulang (Hapus Progres)</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'finished') {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white rounded-3xl p-12 w-full max-w-md shadow-2xl text-center">
                            <div className="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                                <IconCheck />
                            </div>
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Ujian Selesai!</h2>
                            <p className="text-gray-600 mb-6">Terima kasih, data Anda telah tersimpan ke sistem.</p>
                            <div className="bg-gray-50 p-4 rounded-xl">
                                <p className="text-sm text-gray-500">Nilai Anda:</p>
                                <p className="text-4xl font-black text-cyan-600">{scoreResult}</p>
                            </div>
                        </div>
                    </div>
                );
            }

            // EXAM VIEW
            const activeQ = questions[activeIdx];

            return (
                <div className="flex flex-col h-screen bg-gray-50 text-gray-800">
                    {/* Header */}
                    <header className="bg-white shadow-sm px-6 py-4 flex justify-between items-center z-10 shrink-0">
                        <div>
                            <h1 className="text-xl font-bold text-cyan-700 uppercase">BAHASA ARAB</h1>
                            <p className="text-xs text-gray-500 font-semibold">{student.nama} | Kelas {student.kelas}</p>
                        </div>
                        <div className="flex items-center gap-4">
                            {violations > 0 && <span className="bg-red-100 text-red-600 px-3 py-1 rounded-full text-xs font-bold animate-pulse">Pelanggaran: {violations}/2</span>}
                            <div className={`flex items-center gap-2 font-mono text-xl font-bold px-4 py-2 rounded-lg ${timeLeft < 300 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-cyan-100 text-cyan-700'}`}>
                                <IconClock /> {formatTime(timeLeft)}
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col md:flex-row overflow-hidden">
                        {/* Area Soal */}
                        <div className="flex-1 p-6 md:p-10 overflow-y-auto">
                            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 max-w-4xl mx-auto">
                                <div className="mb-6 flex justify-between items-center border-b pb-4">
                                    <span className="text-lg font-bold text-gray-500">Soal No. {activeIdx + 1}</span>
                                </div>
                                
                                {activeQ.image && (
                                    <img src={activeQ.image} alt="Ilustrasi Soal" className="max-w-full h-auto rounded-lg mb-6 shadow-sm mx-auto" />
                                )}

                                <div className={`text-xl mb-10 whitespace-pre-line ${activeQ.isArabic ? 'font-arabic arabic-text text-3xl' : 'leading-relaxed'}`}>
                                    {activeQ.questionText}
                                </div>

                                {/* Opsi Jawaban MCQ */}
                                {activeQ.type === 'mc' && (
                                    <div className="space-y-4">
                                        {activeQ.options.map(opt => {
                                            const isSelected = answers[activeQ.id] === opt.id;
                                            return (
                                                <button 
                                                    key={opt.id}
                                                    onClick={() => setAnswers({...answers, [activeQ.id]: opt.id})}
                                                    className={`w-full text-left p-5 rounded-xl border-2 transition-all flex items-center gap-4 ${isSelected ? 'border-cyan-500 bg-cyan-50' : 'border-gray-200 hover:border-cyan-300 hover:bg-gray-50'}`}
                                                >
                                                    <span className={`w-10 h-10 shrink-0 flex items-center justify-center rounded-full font-bold text-lg ${isSelected ? 'bg-cyan-500 text-white' : 'bg-gray-200 text-gray-600'}`}>
                                                        {opt.id}
                                                    </span>
                                                    <div className="flex-1">
                                                        {opt.image && <img src={opt.image} alt="Opsi" className="mb-3 rounded max-h-40" />}
                                                        <span className={`text-lg ${activeQ.isArabic ? 'font-arabic arabic-text block text-2xl' : ''}`}>{opt.text}</span>
                                                    </div>
                                                </button>
                                            );
                                        })}
                                    </div>
                                )}

                                {/* Opsi Jawaban MATCHING */}
                                {activeQ.type === 'matching' && (
                                    <div className="space-y-6">
                                        {activeQ.premises.map(premise => (
                                            <div key={premise.id} className="flex flex-col md:flex-row gap-4 items-center bg-gray-50 p-4 rounded-xl border border-gray-200">
                                                <div className="flex-1 font-semibold">{premise.text}</div>
                                                <div className="shrink-0 w-full md:w-64">
                                                    <select 
                                                        className="w-full p-3 rounded-lg border border-gray-300 font-arabic text-xl text-right dir-rtl outline-none focus:ring-2 focus:ring-cyan-500"
                                                        value={answers[`${activeQ.id}_${premise.id}`] || ''}
                                                        onChange={(e) => setAnswers({...answers, [`${activeQ.id}_${premise.id}`]: e.target.value})}
                                                    >
                                                        <option value="" disabled>-- Pilih Pasangan --</option>
                                                        {activeQ.targets.map(target => (
                                                            <option key={target.id} value={target.id}>{target.text}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Navigasi Bawah */}
                            <div className="max-w-4xl mx-auto mt-6 flex justify-between items-center">
                                <button disabled={activeIdx === 0} onClick={() => setActiveIdx(prev => prev - 1)} className="px-6 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl disabled:opacity-50 hover:bg-gray-300 transition">
                                    Sebelumnya
                                </button>
                                {activeIdx < questions.length - 1 ? (
                                    <button onClick={() => setActiveIdx(prev => prev + 1)} className="px-6 py-3 bg-cyan-600 text-white font-bold rounded-xl hover:bg-cyan-700 transition">
                                        Selanjutnya
                                    </button>
                                ) : (
                                    <button onClick={promptSubmit} className="px-8 py-3 bg-green-600 text-white font-bold rounded-xl hover:bg-green-700 transition shadow-lg">
                                        Selesai & Kumpulkan
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Navigasi Kotak Soal */}
                        <div className="w-full md:w-80 bg-white border-l border-gray-200 p-6 overflow-y-auto shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] md:shadow-none">
                            <h3 className="font-bold text-gray-700 mb-4">Navigasi Soal</h3>
                            <div className="grid grid-cols-5 gap-2">
                                {questions.map((q, i) => {
                                    let isAnswered = false;
                                    if (q.type === 'mc') {
                                        isAnswered = !!answers[q.id];
                                    } else if (q.type === 'matching') {
                                        // Cek apakah semua premise sudah diisi
                                        isAnswered = q.premises.every(p => !!answers[`${q.id}_${p.id}`]);
                                    }

                                    const isActive = activeIdx === i;
                                    
                                    let btnClass = "w-full aspect-square rounded-lg font-bold flex items-center justify-center transition-all ";
                                    if (isAnswered) btnClass += "bg-green-500 text-white shadow-md ";
                                    else btnClass += "bg-gray-100 text-gray-600 border border-gray-300 ";
                                    
                                    if (isActive) btnClass += "ring-4 ring-cyan-400 ring-offset-2 scale-105 z-10";

                                    return (
                                        <button key={q.id} onClick={() => setActiveIdx(i)} className={btnClass}>
                                            {i + 1}
                                        </button>
                                    );
                                })}
                            </div>
                            <div className="mt-8 space-y-2 text-sm text-gray-600">
                                <div className="flex items-center gap-2"><div className="w-4 h-4 bg-green-500 rounded"></div> Sudah Dijawab</div>
                                <div className="flex items-center gap-2"><div className="w-4 h-4 bg-gray-100 border border-gray-300 rounded"></div> Belum Dijawab</div>
                                <div className="flex items-center gap-2"><div className="w-4 h-4 rounded ring-2 ring-cyan-400"></div> Posisi Saat Ini</div>
                            </div>
                        </div>
                    </main>

                    {/* Modals Rendering (Di luar flow utama DOM agar tidak flickr) */}
                    {modal && modal.type === 'alert' && <ModalAlert {...modal} />}
                    {modal && modal.type === 'confirm' && <ModalConfirm {...modal} />}
                    
                    {/* Loading Overlay saat submit */}
                    {isSubmitting && (
                        <div className="fixed inset-0 z-[60] bg-white/80 backdrop-blur flex items-center justify-center">
                            <div className="text-xl font-bold text-cyan-700 animate-bounce">Mengirim Data...</div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
